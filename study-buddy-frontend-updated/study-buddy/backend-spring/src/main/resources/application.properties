# Spring Boot Application Properties for Study Buddy
server.port=8080
spring.application.name=unicollab-backend

# MySQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/studybuddy_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Initial Data Seeding
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET:unicollab-secure-jwt-secret-key-32-chars-minimum-token}
jwt.expiration-ms=604800000

# Gemini AI API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.8-flash

# Cloudinary Cloud Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Maximum File Upload Size (25MB)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
